# Local development services. Production uses Neon (managed PostgreSQL) and
# an SMTP provider (docs/architecture.md, "Email").
name: nutri

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nutri
      POSTGRES_PASSWORD: nutri
      POSTGRES_DB: nutri
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ images keep PGDATA under /var/lib/postgresql/<major>/,
      # so the volume is mounted on the parent directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nutri -d nutri']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the API sends in development; nothing leaves the
  # machine. SMTP on 1025 (the API's default SMTP_URL), inbox at
  # http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
