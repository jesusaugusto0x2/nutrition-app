name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No git hooks, Nx daemon or Nx Cloud in CI (same as the Dockerfile).
  HUSKY: 0
  NX_DAEMON: false
  NX_NO_CLOUD: true
  # Nx 23 keeps its cache under ~/.nx by default; an explicit directory keeps
  # it (and its metadata DB, .nx/workspace-data) inside the checkout.
  NX_CACHE_DIRECTORY: .nx/cache
  # Keeps the saved Nx cache well under the repository cache quota.
  NX_MAX_CACHE_SIZE: 1GB
  # Pull requests run only the projects they affect (Nx diffs against the
  # merge base with the target branch); pushes to main run every project.
  NX_RUN: ${{ github.event_name == 'pull_request' && 'affected' || 'run-many' }}
  NX_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      # `nx affected` needs the base branch history; the tree filter keeps
      # the full-history clone small.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      # Version comes from `packageManager` in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # Caches the pnpm store, keyed by the lockfile hash.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The local commit-msg hook can be skipped, so every commit the pull
      # request adds is checked again. Merge commits are ignored by the
      # conventional config.
      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: TypeScript project references
        run: pnpm nx sync:check

      # Neither command connects to the database, but drizzle.config.ts
      # requires DATABASE_URL, so a placeholder is enough.
      - name: Drizzle schema and migrations
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/unused
        run: |
          pnpm --filter @nutri/api exec drizzle-kit check
          pnpm --filter @nutri/api exec drizzle-kit generate
          if [ -n "$(git status --porcelain -- apps/api/src/database/migrations)" ]; then
            git status --porcelain -- apps/api/src/database/migrations
            echo "::error::The Drizzle schema changed without a migration. Run 'pnpm db:generate' and commit the new migration."
            exit 1
          fi

      # Saved once per commit; a new commit restores the latest cache saved
      # for the same lockfile. Nx only reuses artifacts it has metadata for,
      # so the workspace-data DB is cached together with the artifacts.
      - name: Restore Nx cache
        uses: actions/cache@v6
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: ${{ runner.os }}-nx-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm nx "$NX_RUN" -t lint

      - name: Typecheck
        run: pnpm nx "$NX_RUN" -t typecheck

      # Vitest disables watch mode when CI=true (set by GitHub Actions), so
      # the `testMode: "watch"` target runs once and exits.
      - name: Test
        run: pnpm nx "$NX_RUN" -t test

      - name: Build
        run: pnpm nx "$NX_RUN" -t build

      # The build regenerates committed files (routeTree.gen.ts), so any
      # change here means a generated file was not committed.
      - name: Generated files are committed
        run: |
          changes="$(git status --porcelain)"
          if [ -z "$changes" ]; then
            exit 0
          fi
          echo "$changes"
          echo "$changes" | while read -r _ file; do
            case "$file" in
              apps/web/src/routeTree.gen.ts)
                hint="Run 'pnpm nx build web' (or 'pnpm dev') to regenerate it and commit the result." ;;
              *)
                hint="A build step changed or created it: regenerate it locally and commit it, or ignore it in .gitignore." ;;
            esac
            echo "::error file=$file::$file is out of date. $hint"
          done
          exit 1
