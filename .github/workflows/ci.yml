name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No git hooks, Nx daemon or Nx Cloud in CI (same as the Dockerfile).
  HUSKY: 0
  NX_DAEMON: false
  NX_NO_CLOUD: true

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version comes from `packageManager` in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Vitest disables watch mode when CI=true (set by GitHub Actions), so
      # the `testMode: "watch"` target runs once and exits.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
